[package]
name = "markov-storage-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "markov-storage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
markov-storage = { path = "../markov-storage" }
serde_json = "1.0.151"
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
